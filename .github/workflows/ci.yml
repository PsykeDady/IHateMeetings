name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --python 3.13 --extra dev --extra alignment --extra diarization
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv run ihm --help
      - run: uv run ihm doctor
