[project]
name = "ihatemeetings"
version = "0.2.0"
description = "Local-first intelligent meeting transcription."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "IHateMeetings contributors" }
]
keywords = ["transcription", "meetings", "asr", "diarization", "local-first"]
dependencies = [
  "faster-whisper==1.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
ihm = "ihatemeetings.cli.main:main"
ihatemeetings = "ihatemeetings.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "real_asr: runs local faster-whisper inference and requires an explicitly cached model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
