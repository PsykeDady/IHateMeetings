[project]
name = "ihatemeetings"
version = "0.5.0"
description = "Local-first intelligent meeting transcription."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
  { name = "IHateMeetings contributors" }
]
keywords = ["transcription", "meetings", "asr", "diarization", "local-first"]
dependencies = [
  "faster-whisper==1.2.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
alignment = [
  "torch==2.14.0",
  "transformers==5.16.1",
]
diarization = [
  "pyannote-audio==4.0.7",
  "torchaudio==2.11.0",
  "torchcodec==0.16.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
ihm = "ihatemeetings.cli.main:main"
ihatemeetings = "ihatemeetings.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "real_asr: runs local faster-whisper inference and requires an explicitly cached model",
  "real_alignment: runs local CTC word alignment and requires explicitly cached models",
  "real_diarization: runs local pyannote diarization and requires an explicitly cached model",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }
